<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Street Map - อาคารวิทยวิภาส (SC.09)</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- MapLibre GL JS & CSS -->
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />



    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Prompt', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0b0f19;
            color: #0f172a;
        }

        /* Layer 1: MapLibre 3D Street Map */
        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }



        /* Top Header Card */
        .hud-header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.85);
            border-radius: 18px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
        }
        .hud-logo {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }
        .hud-title-wrap h1 {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
            line-height: 1.25;
        }
        .hud-title-wrap p {
            font-size: 12px;
            color: #64748b;
            margin-top: 2px;
        }
        .hud-tags {
            display: flex;
            gap: 6px;
            margin-top: 5px;
            align-items: center;
        }
        .tag-pill {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 999px;
        }
        .tag-gps {
            background: #e0f2fe;
            color: #0284c7;
            border: 1px solid #bae6fd;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .tag-gps::before {
            content: '';
            width: 6px;
            height: 6px;
            background: #0284c7;
            border-radius: 50%;
            box-shadow: 0 0 6px #0284c7;
        }
        .tag-map {
            background: #ecfdf5;
            color: #059669;
            border: 1px solid #a7f3d0;
        }

        /* Top Right Controls */
        .hud-top-right {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            gap: 8px;
        }
        .hud-btn {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.85);
            border-radius: 12px;
            color: #1e293b;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease;
        }
        .hud-btn:hover {
            background: #ffffff;
            color: #2563eb;
            transform: translateY(-1px);
        }

        /* PRIMARY HERO DOCK: MOVE TO FLOOR 01 */
        .hud-hero-dock {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
        }
        .btn-enter-floor01 {
            background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 50%, #0284c7 100%);
            border: 2px solid #ffffff;
            border-radius: 999px;
            padding: 16px 36px;
            color: #ffffff;
            font-family: inherit;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 12px 35px rgba(37, 99, 235, 0.5), 0 0 30px rgba(56, 189, 248, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: heroPulse 2.4s infinite alternate;
        }
        @keyframes heroPulse {
            0% {
                transform: scale(1);
                box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
            }
            100% {
                transform: scale(1.03);
                box-shadow: 0 16px 45px rgba(37, 99, 235, 0.7), 0 0 40px rgba(56, 189, 248, 0.5);
            }
        }
        .btn-enter-floor01:hover {
            transform: scale(1.06) translateY(-2px);
            box-shadow: 0 18px 45px rgba(37, 99, 235, 0.8);
        }
        .btn-enter-floor01:active {
            transform: scale(0.98);
        }
        .btn-enter-floor01 .arrow-icon {
            font-size: 20px;
            transition: transform 0.2s ease;
        }
        .btn-enter-floor01:hover .arrow-icon {
            transform: translateX(4px);
        }

        .hud-secondary-nav {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 999px;
            padding: 6px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        }
        .sec-btn {
            background: transparent;
            border: none;
            border-radius: 999px;
            padding: 6px 14px;
            color: #475569;
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .sec-btn:hover {
            background: #f1f5f9;
            color: #1d4ed8;
        }

        /* 3D Pin Directly on SC.09 */
        .sc09-marker {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .sc09-marker:hover {
            transform: scale(1.1) translateY(-6px);
        }
        .marker-card {
            background: #0f172a;
            border: 2px solid #38bdf8;
            border-radius: 14px;
            padding: 8px 16px;
            color: #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4), 0 0 20px rgba(56, 189, 248, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            white-space: nowrap;
        }
        .marker-title {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .marker-btn-action {
            margin-top: 4px;
            background: #0284c7;
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .marker-arrow {
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 8px solid #0f172a;
            margin-top: -1px;
        }
        .marker-pulse {
            width: 10px;
            height: 10px;
            background: #0284c7;
            border-radius: 50%;
            margin-top: 3px;
            box-shadow: 0 0 0 0 rgba(2, 132, 199, 0.7);
            animation: pulseWave 1.8s infinite;
        }
        @keyframes pulseWave {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(2, 132, 199, 0.7);
            }
            70% {
                transform: scale(1.05);
                box-shadow: 0 0 0 14px rgba(2, 132, 199, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(2, 132, 199, 0);
            }
        }



        /* Fullscreen Fade Transition */
        #portal-overlay {
            position: fixed;
            inset: 0;
            background: #000000;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #portal-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <!-- 1. MapLibre 3D Street Map Viewport -->
    <div id="map"></div>



    <!-- Portal Fade Transition -->
    <div id="portal-overlay"></div>

    <!-- Top Left Header -->
    <div class="hud-header">
        <img src="../logo.png" alt="Logo" class="hud-logo" onerror="this.style.display='none'">
        <div class="hud-title-wrap">
            <h1>อาคารวิทยวิภาส (SC.09)</h1>
            <p>วิทยาลัยการคอมพิวเตอร์ • มหาวิทยาลัยขอนแก่น</p>
            <div class="hud-tags">
                <span class="tag-pill tag-gps">📍 16.4757° N, 102.8251° E</span>
                <span class="tag-pill tag-map">🗺️ 3D Campus Map</span>
            </div>
        </div>
    </div>

    <!-- Top Right Controls -->
    <div class="hud-top-right">
        <button class="hud-btn" onclick="resetMapView()" title="รีเซ็ตมุมมองแผนที่">
            🎯 รีเซ็ตมุมมอง
        </button>
    </div>

    <!-- PRIMARY HERO DOCK: MOVE TO FLOOR 01 -->
    <div class="hud-hero-dock">
        <button class="btn-enter-floor01" id="btn-move-floor01" onclick="moveToFloor01()">
            <span>🏢</span>
            <span>เข้าสู่อาคาร (มูฟไปที่ Floor 01)</span>
            <span class="arrow-icon">➔</span>
        </button>

        <div class="hud-secondary-nav">
            <button class="sec-btn" onclick="navigateToScene('../')">
                🚪 หน้าตึก
            </button>
            <button class="sec-btn" onclick="navigateToScene('../inside/')">
                🏛️ โถงชั้น 1
            </button>
            <button class="sec-btn" onclick="navigateToScene('../floor01/')">
                🏢 ชั้น 1 (Floor 01)
            </button>
            <button class="sec-btn" onclick="navigateToScene('../floor02/')">
                📚 ชั้น 2 (Floor 02)
            </button>
            <button class="sec-btn" onclick="navigateToScene('../floor03/')">
                🔬 ชั้น 3 (Floor 03)
            </button>
            <button class="sec-btn" onclick="navigateToScene('../floor04/')">
                💻 ชั้น 4 (Floor 04)
            </button>
            <button class="sec-btn" onclick="navigateToScene('../floor05/')">
                ⚡ ชั้น 5 (Floor 05)
            </button>
        </div>
    </div>



    <script>
        // Exact Geographical Center of SC.09 Khon Kaen University
        const SC09_LNG = 102.82514;
        const SC09_LAT = 16.47566;
        const SC09_CENTER = [SC09_LNG, SC09_LAT];

        // Meters per degree conversion around latitude 16.475°
        const METERS_PER_DEG_LAT = 111319.5;
        const METERS_PER_DEG_LNG = 111319.5 * Math.cos(SC09_LAT * Math.PI / 180);

        // --- 1. Initialize MapLibre 3D Street Map ---
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/liberty',
            center: SC09_CENTER,
            zoom: 17.5,
            pitch: 60,
            bearing: -25,
            antialias: true
        });

        map.addControl(new maplibregl.NavigationControl({
            visualizePitch: true
        }), 'top-right');

        // Configure 3D buildings layer
        map.on('load', () => {
            if (map.getLayer('building-3d')) {
                map.setPaintProperty('building-3d', 'fill-extrusion-color', [
                    'interpolate', ['linear'], ['get', 'render_height'],
                    0, '#c7d2de',
                    15, '#a3b3c5',
                    35, '#5b82a6',
                    60, '#3b6790'
                ]);
                map.setPaintProperty('building-3d', 'fill-extrusion-opacity', 0.92);
            }

            // Interactive 3D Marker directly on SC.09
            const markerEl = document.createElement('div');
            markerEl.className = 'sc09-marker';
            markerEl.innerHTML = `
                <div class="marker-card">
                    <div class="marker-title">🏢 อาคารวิทยวิภาส (SC.09)</div>
                    <div class="marker-btn-action">⚡ คลิกเพื่อมูฟไปที่ Floor 01 ➜</div>
                </div>
                <div class="marker-arrow"></div>
                <div class="marker-pulse"></div>
            `;
            markerEl.addEventListener('click', moveToFloor01);

            new maplibregl.Marker({
                element: markerEl,
                anchor: 'bottom'
            })
            .setLngLat(SC09_CENTER)
            .addTo(map);
        });

        window.addEventListener('resize', () => {
            map.resize();
        });

        // --- 2. Navigation Actions ---
        let isTransitioning = false;

        function moveToFloor01() {
            if (isTransitioning) return;
            isTransitioning = true;

            const btn = document.getElementById('btn-move-floor01');
            if (btn) {
                btn.style.transform = 'scale(0.96)';
                btn.innerHTML = '<span>⚡</span> <span>กำลังเข้าสู่อาคาร Floor 01...</span>';
            }

            // Cinematic MapLibre flyTo into SC.09
            map.flyTo({
                center: [SC09_LNG, SC09_LAT],
                zoom: 19.8,
                pitch: 80,
                bearing: -15,
                speed: 1.4,
                curve: 1.3,
                essential: true
            });

            setTimeout(() => {
                const overlay = document.getElementById('portal-overlay');
                overlay.classList.add('active');
            }, 650);

            setTimeout(() => {
                window.location.href = '../floor01/';
            }, 1150);
        }

        function navigateToScene(url) {
            if (isTransitioning) return;
            isTransitioning = true;
            const overlay = document.getElementById('portal-overlay');
            overlay.classList.add('active');
            setTimeout(() => {
                window.location.href = url;
            }, 450);
        }

        function resetMapView() {
            map.flyTo({
                center: SC09_CENTER,
                zoom: 17.5,
                pitch: 60,
                bearing: -25,
                essential: true
            });
        }
    </script>
</body>
</html>
